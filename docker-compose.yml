services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mobilemall
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: mobilemall
    volumes: [pgdata:/var/lib/postgresql/data]
    # no public port mapping on purpose; backend reaches it over the internal network
  backend:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
